<style>

body{font-family:'Tajawal',Tahoma,sans-serif;overflow-x:hidden}
.bg-scene{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#ecfdf5,#eff6ff,#fdf4ff,#fff7ed);background-size:300% 300%;animation:bgShift 14s ease infinite}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:float 12s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}33%{transform:translateY(-35px) translateX(20px)}66%{transform:translateY(20px) translateX(-25px)}}
nav{backdrop-filter:blur(14px);background:rgba(5,150,105,.85)!important}

.stage-card::before{content:'';position:absolute;top:-40%;left:-20%;width:70%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.stage-card::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:22px 22px;pointer-events:none}
.stage-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 18px 45px rgba(0,0,0,.22)}
.stage-emoji{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:1.4rem;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);font-size:2.9rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 8px 18px rgba(0,0,0,.15);transition:transform .25s}
.stage-card:hover .stage-emoji{transform:rotate(-8deg) scale(1.12)}
.grade-icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:.9rem;background:linear-gradient(135deg,#d1fae5,#a7f3d0);font-size:1.4rem;box-shadow:0 3px 8px rgba(5,150,105,.2)}
.letter-tile{transition:transform .15s,box-shadow .15s;border:none;cursor:pointer}
.letter-tile:hover{box-shadow:0 12px 28px rgba(5,150,105,.3)}
.letter-tile:active{transform:scale(.88)}
.big-letter{background:linear-gradient(145deg,#34d399,#059669);color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.25);box-shadow:0 12px 30px rgba(5,150,105,.4)}
.big-number{background:linear-gradient(145deg,#60a5fa,#2563eb);color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.25);box-shadow:0 12px 30px rgba(37,99,235,.4)}
.btn-glow{box-shadow:0 8px 22px rgba(5,150,105,.35);transition:transform .15s,box-shadow .15s}
.btn-glow:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(5,150,105,.45)}
.trace-box{border:2px dashed #059669;border-radius:1rem;background:repeating-linear-gradient(transparent,transparent 38px,#d1fae5 38px,#d1fae5 40px)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounceSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bounce-slow{animation:bounceSlow 2.2s ease-in-out infinite}
.confetti{position:fixed;top:-12px;font-size:22px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

const qs = [];
for(let i=0;i<n;i++){
if(kind==="قدرات"){
const a=2+(i%8), b=3+((i*2)%7);
qs.push({q:⁠ما ناتج: ${a} + ${b} = ؟⁠,options:[String(a+b),String(a+b+1),String(a+b-1),String(a+b+2)],correct:0,
explanation:⁠نجمع العددين مباشرة: ${a} + ${b} = ${a+b}.⁠});
} else {
const words=["الشمس","القمر","النجم","الماء","الهواء"];
const w=words[i%words.length];
qs.push({q:⁠اختر الكلمة المكتوبة إملاءً صحيحاً:⁠,options:[w,w+"ة","ال"+w+"ات",w+"ـن"],correct:0,
explanation:⁠الكلمة "${w}" تُكتب هكذا حسب القواعد الإملائية الصحيحة.⁠});
}
}
return qs;
}

{q:"Complete: I ___ a student.",options:["is","are","am","be"],correct:2,explanation:"With 'I' we use 'am'."},
{q:"How many days are in a week?",options:["5","6","7","8"],correct:2,explanation:"A week has 7 days."}
]}}]}
]},
{id:"s4",emoji:"🎯",color:"bg-amber-500",title:"القدرات والتحصيلي",sub:"اختبارات شاملـة",

function loadDB(){
let db = JSON.parse(localStorage.getItem(DB_KEY)||"null");
if(!db){ db = {users:[],subs:[]}; saveDB(db); }
return db;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function currentUser(){
const sid = localStorage.getItem("lntalem_session");
if(!sid) return null;
return loadDB().users.find(u=>u.id=sid)||null;
}
function isSubscribed(){
const u = currentUser();
return u && (u.status="active" || u.is_admin);
}
function speak(text,lang){
speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = lang || (/[a-zA-Z]/.test(text)&&!/[\u0600-\u06FF]/.test(text) ? "en-US" : "ar-SA");
u.rate = 0.85;
speechSynthesis.speak(u);
}
function go(view,arg){ render(view,arg); window.scrollTo(0,0); }
function openPaywall(){ document.getElementById("paywall").classList.replace("hidden","flex"); }
function closePaywall(){ document.getElementById("paywall").classList.replace("flex","hidden"); }
function renderNav(){
const u = currentUser();
const el = document.getElementById("nav-user");
if(!u){
el.innerHTML = ⁠<button onclick="go('login')" class="bg-white/20 px-4 py-1 rounded-lg hover:bg-white/30">تسجيل الدخول</button>⁠;
} else {
const badge = u.is_admin ? ⁠<span class="bg-amber-400 text-amber-900 text-xs px-2 py-1 rounded-full font-bold">مشرف</span>⁠
: u.status==="active" ? ⁠<span class="bg-emerald-300 text-emerald-900 text-xs px-2 py-1 rounded-full font-bold">مشترك ✓</span>⁠
: u.status==="pending" ? ⁠<span class="bg-yellow-300 text-yellow-900 text-xs px-2 py-1 rounded-full font-bold">قيد المراجعة ⏳</span>⁠ : "";
el.innerHTML = ⁠${badge} <span class="text-sm hidden sm:inline">${u.email}</span> ${u.is_admin?⁠<button onclick="go('admin')" class="bg-amber-400 text-amber-900 px-3 py-1 rounded-lg font-bold text-sm">لوحة المشرف</button>⁠:""} <button onclick="logout()" class="bg-white/20 px-3 py-1 rounded-lg text-sm hover:bg-white/30">خروج</button>⁠;
}
}
function logout(){ localStorage.removeItem("lntalem_session"); renderNav(); go("home"); }
function render(view,arg){
renderNav();
const app = document.getElementById("app");
if(view==="home") return renderHome(app);
if(view==="stage") return renderStage(app,arg);
if(view==="lesson") return renderLesson(app,arg);
if(view==="quiz") return renderQuizIntro(app,arg);
if(view==="subscribe") return renderSubscribe(app);
if(view==="login") return renderLogin(app);
if(view==="admin") return renderAdmin(app);
}
function renderHome(app){
app.innerHTML = ⁠ <div class="text-center py-10"> <h1 class="text-4xl font-extrabold text-emerald-800 mb-3">أهلاً بك في <span class="bg-gradient-to-l from-emerald-600 to-teal-500 bg-clip-text text-transparent">منصة لنتعلم</span> 👋</h1> <p class="text-gray-600 text-lg">اختر مرحلتك وابدأ رحلة التعلّم خطوة بخطوة</p> </div> <div class="grid sm:grid-cols-2 gap-5"> ${CONTENT.map(s=>⁠
<button onclick="go('stage','${s.id}')" class="stage-card ${s.color} text-white p-8">
<span class="stage-emoji mb-4">￼
<h2 class="text-2xl font-bold">{s.title}</h2>
<p class="opacity-90 mt-1">${s.sub}</p>
<span class="inline-block mt-4 bg-white/25 px-4 py-1.5 rounded-full text-sm font-bold">ابدأ الآن ←</span>
</button>⁠).join("")} </div>⁠;
}
function renderStage(app,sid){
const s = CONTENT.find(x=>x.id===sid);
app.innerHTML = ⁠ <button onclick="go('home')" class="text-emerald-700 mb-4 underline">← العودة للرئيسية</button> <div class="${s.color} text-white rounded-3xl p-6 mb-6 flex items-center gap-4"> <span class="text-4xl">${s.emoji}</span> <div><h1 class="text-2xl font-bold">${s.title}</h1><p class="opacity-90">${s.sub}</p></div> </div> <div class="space-y-4"> ${s.grades.map((g,i)=>⁠
<div class="bg-white rounded-2xl shadow overflow-hidden">
<button onclick="toggleGrade('${g.id}')" class="w-full flex items-center justify-between p-5 hover:bg-gray-50">
<span class="flex items-center gap-3 text-lg font-bold"><span class="grade-icon">￼{g.title}</span>
<span id="arrow-${g.id}" class="text-gray-400 transition">▾</span>
</button>
<div id="grade-${g.id}" class="${i===0?'':'hidden'} border-t p-4 space-y-2 bg-gray-50">
${(g.lessons||[]).map(l=>⁠ <button onclick="go('lesson',{sid:'${s.id}',gid:'${g.id}',lid:'${l.id}'})" class="w-full flex items-center justify-between bg-white border rounded-xl p-4 hover:border-emerald-500 hover:shadow"> <span class="font-bold">${l.title}</span> <span class="text-gray-400">🔒</span> </button>⁠).join("")}
${(g.tests||[]).map(t=>⁠ <button onclick="go('quiz','${t.id}')" class="w-full flex items-center justify-between bg-white border rounded-xl p-4 hover:border-emerald-500 hover:shadow"> <span class="font-bold">${t.title} <span class="text-xs text-gray-500">(20 سؤالاً)</span></span> <span class="text-gray-400">🔒</span> </button>⁠).join("")}
</div>
</div>⁠).join("")} </div>⁠;
}
function toggleGrade(gid){
document.getElementById("grade-"+gid).classList.toggle("hidden");
}
function renderLesson(app,{sid,gid,lid}){
if(!isSubscribed()){ go("stage",sid); openPaywall(); return; }
const s=CONTENT.find(x=>x.id=sid), g=s.grades.find(x=>x.id=gid), l=g.lessons.find(x=>x.id=lid);
let body="";
if(l.body="letter"){
body=⁠<div class="text-center"> <button onclick="speak('${l.data}')" class="letter-tile big-letter text-8xl font-extrabold w-44 h-44 rounded-3xl mx-auto block">🔊 ${l.data}</button> <p class="mt-4 text-gray-600">انقر على الحرف لسماع نطقه</p></div>⁠;
} else if(l.body==="number"){
body=⁠<div class="text-center"> <button onclick="speak('${l.data}')" class="letter-tile big-number text-8xl font-extrabold w-44 h-44 rounded-3xl mx-auto block">🔊 ${l.data}</button> <p class="mt-4 text-gray-600">عدّ معي: ${"●".repeat(l.data)}</p></div>⁠;
} else if(l.body==="letters"){
body=⁠<p class="text-gray-600 mb-3">انقر على أي حرف لسماع نطقه:</p><div class="flex flex-wrap gap-2">⁠+
l.data.map(L=>⁠<button onclick="speak('${L}')" class="letter-tile bg-indigo-100 hover:bg-indigo-200 w-12 h-12 rounded-xl font-bold text-lg shadow">${L}</button>⁠).join("")+⁠</div>⁠;
} else if(l.body==="quiz"){
return renderQuizIntro(app,l.data);
} else {
body=⁠<div class="bg-gray-50 rounded-xl p-5 leading-loose text-lg">${l.data}</div>⁠;
}
app.innerHTML = ⁠ <button onclick="go('stage','${sid}')" class="text-emerald-700 mb-4 underline">← عودة</button> <h1 class="text-2xl font-bold mb-4">${l.title}</h1>${body}⁠;
}
let QZ=null;
function renderQuizIntro(app,arg){
if(!isSubscribed()){ go("home"); openPaywall(); return; }
let title,questions;
if(typeof arg==="string"){
const t=[...abilityTests,...achievementTests].find(x=>x.id=arg);
title=t.title; questions=t.questions;
} else { title="اختبار تقييمي"; questions=arg.questions; }
app.innerHTML=⁠ <button onclick="history.back()" class="text-emerald-700 mb-4 underline">← عودة</button> <div class="bg-white rounded-2xl shadow p-8 text-center"> <div class="text-6xl mb-4">📝</div> <h1 class="text-2xl font-bold mb-2">${title}</h1> <p class="text-gray-600 mb-6">${questions.length} سؤالاً</p> <button onclick='startQuiz(${JSON.stringify({title,questions}).replace(/'/g,"&#39;")})' class="btn-glow bg-emerald-600 text-white px-10 py-3.5 rounded-xl font-extrabold text-lg">🚀 ابدأ الاختبار</button> </div>⁠;
}
function startQuiz(data){
QZ={...data,i:0,score:0,locked:false};
renderQuizQ();
}
function renderQuizQ(){
const app=document.getElementById("app");
const q=QZ.questions[QZ.i];
app.innerHTML=⁠ <div class="bg-white rounded-2xl shadow p-6"> <div class="flex justify-between text-sm text-gray-500 mb-3"> <span>سؤال ${QZ.i+1} من ${QZ.questions.length}</span><span>النقاط: ${QZ.score}</span> </div> <h2 class="text-xl font-bold mb-3">${q.q}</h2> <div class="grid gap-3"> ${q.options.map((o,i)=>⁠<button id="opt${i}" onclick="answer(${i})" class="p-4 rounded-xl border-2 border-gray-200 text-right hover:border-emerald-500 font-bold">${o}</button>⁠).join("")} </div> <p id="expl" class="hidden mt-4 bg-emerald-50 border-r-4 border-emerald-500 p-3 rounded-lg"></p> </div>⁠;
}
function answer(i){
if(QZ.locked)return; QZ.locked=true;
const q=QZ.questions[QZ.i];
const ok=i=q.correct;
if(ok)QZ.score++;
document.getElementById("opt"+i).className=⁠p-4 rounded-xl border-2 ${ok?'border-green-500 bg-green-50':'border-red-500 bg-red-50'} text-right font-bold⁠;
document.getElementById("opt"+q.correct).className="p-4 rounded-xl border-2 border-green-500 bg-green-50 text-right font-bold";
const e=document.getElementById("expl");
e.innerHTML="💡 <b>الشرح:</b> "+q.explanation;
e.classList.remove("hidden");
setTimeout(()=>{
QZ.locked=false;
if(QZ.i+1<QZ.questions.length){QZ.i++;renderQuizQ();}
else renderQuizResult();
},2000);
}
function renderQuizResult(){
const pct=Math.round(QZ.score/QZ.questions.length*100);
document.getElementById("app").innerHTML=⁠ <div class="bg-white rounded-2xl shadow p-8 text-center pop"> <h2 class="text-2xl font-bold">نتيجتك: ${QZ.score} من ${QZ.questions.length} (${pct}%)</h2> <button onclick="go('home')" class="btn-glow mt-6 bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold">العودة للرئيسية</button> </div>⁠;
}

app.innerHTML=⁠ <div class="max-w-md mx-auto bg-white rounded-2xl shadow p-8 mt-6"> <h1 class="text-2xl font-bold text-center mb-6">تسجيل الدخول 🔐</h1> <input id="em" type="email" placeholder="البريد الإلكتروني" class="w-full border rounded-xl p-3 mb-3"> <input id="pw" type="password" placeholder="كلمة المرور" class="w-full border rounded-xl p-3 mb-4"> <button onclick="doLogin()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700">دخول</button> <p class="text-center text-sm text-gray-500 mt-3">ليس لديك حساب؟ <button onclick="doRegister()" class="text-emerald-600 underline">أنشئ حساباً جديداً</button></p> </div>⁠;

let receiptData=null;
function pickReceipt(inp){
const f=inp.files[0];
if(!f)return;
const r=new FileReader();
r.onload=e=>{receiptData=e.target.result;document.getElementById("rc-label").innerHTML="✅ "+f.name;};
r.readAsDataURL(f);
}
function submitSub(){
if(!receiptData)return alert("يرجى إرفاق صورة الإيصال");
const db=loadDB(), u=currentUser();
db.subs.push({id:"s"+Date.now(),userId:u.id,plan:"yearly",receipt:receiptData,status:"pending",date:new Date().toLocaleDateString("ar-SA")});
db.users.find(x=>x.id===u.id).status="pending"; saveDB(db);
alert("تم استلام طلبك، وسيتم تفعيله قريباً.");
go("home");
}
function renderAdmin(app){
const u=currentUser();

const db=loadDB();
const pending=db.subs.filter(s=>s.status==="pending");
app.innerHTML=⁠ <h1 class="text-3xl font-bold mb-2">🛠️ لوحة المشرف</h1> <h2 class="text-xl font-bold mb-3">طلبات الاشتراك المعلقة (${pending.length})</h2> <div class="space-y-4"> ${pending.map(s=>⁠<div class="bg-white rounded-xl shadow p-4 flex items-center gap-4">

<button onclick="decide('${s.id}',false)" class="bg-red-600 text-white px-3 py-1 rounded">رفض</button>
</div>⁠).join("")} </div>⁠;
}
function decide(sid,ok){
const db=loadDB();
const s=db.subs.find(x=>x.id=sid);
s.status=ok?"active":"rejected";
db.users.find(x=>x.id=s.userId).status=ok?"active":"rejected";
saveDB(db); renderAdmin(document.getElementById("app")); renderNav();
}
go("home");
</script>
